<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BadGPT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#000; --fg:#f2f2f2; --panel:#111; --bubble:#1c1c1c;
    --line:#2a2a2a; --accent:#7c5cff; --muted:#888;
    color-scheme: dark;
  }
  body.white {
    --bg:#fff; --fg:#111; --panel:#f5f5f5; --bubble:#ececec;
    --line:#dcdcdc; --muted:#666;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, Tahoma, sans-serif;
    display: flex; flex-direction: column;
    transition: background .25s, color .25s;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .title { font-weight: 700; flex: 1; }
  .badge {
    font-size: 13px; padding: 4px 10px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--line); white-space: nowrap;
  }
  .icon-btn {
    background: none; border: none; color: var(--fg);
    font-size: 22px; padding: 4px 8px; cursor: pointer;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.7; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; color: #ff6b6b; font-size: 14px; background: none; text-align: center; }
  .empty { margin: auto; color: var(--muted); text-align: center; }

  footer {
    border-top: 1px solid var(--line); background: var(--bg);
    padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .model-row { display: flex; justify-content: center; margin-bottom: 8px; }
  select {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 12px; font-size: 14px; font-family: inherit;
  }
  .input-row { display: flex; align-items: flex-end; gap: 6px; position: relative; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 10px 14px; font: inherit; max-height: 120px;
  }
  .round {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); font-size: 20px; cursor: pointer;
  }
  .round.primary { background: var(--accent); color: #fff; border: none; }
  .round.rec { background: #e53935; color: #fff; border: none; }
  .attach-menu {
    position: absolute; bottom: 52px; left: 0; display: none;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; min-width: 190px; z-index: 5;
  }
  .attach-menu.open { display: block; }
  .attach-menu button {
    display: block; width: 100%; padding: 12px 14px;
    background: none; border: none; color: var(--fg);
    text-align: left; font-size: 15px; cursor: pointer;
  }

  .drawer-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; z-index: 10;
  }
  .drawer-bg.open { display: block; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: 82%; max-width: 330px;
    background: var(--panel); z-index: 11; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 16px;
    transform: translateX(-100%); transition: transform .25s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h3 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .drawer .item {
    width: 100%; padding: 12px; border-radius: 10px; font-size: 15px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    text-align: left; cursor: pointer; font-family: inherit;
  }
  .drawer .item[disabled] { opacity: .5; cursor: not-allowed; }
  .drawer select { width: 100%; border-radius: 10px; padding: 10px; }
  .toggle { display: flex; gap: 8px; }
  .toggle button {
    flex: 1; padding: 10px; border-radius: 10px; cursor: pointer;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); font-family: inherit;
  }
  .toggle button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .hist { font-size: 13px; color: var(--muted); }
  .hist-item { padding: 8px 0; border-bottom: 1px solid var(--line); word-break: break-word; }
  .hist-item b { color: var(--fg); }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
  <div class="title">BadGPT</div>
  <div class="badge" id="tokens">…</div>
</header>

<div id="messages"><div class="empty" id="emptyMsg">Ask me anything</div></div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer">
  <div class="badge" id="drawerTokens" style="align-self:flex-start">…</div>

  <button class="item" id="newChat">New chat (clear history)</button>

  <h3>Reply language</h3>
  <select id="lang">
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
    <option value="ar">العربية</option>
    <option value="tr">Türkçe</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="hi">हिन्दी</option>
    <option value="ja">日本語</option>
  </select>

  <h3>Background</h3>
  <div class="toggle">
    <button data-theme="black">Black</button>
    <button data-theme="white">White</button>
  </div>

  <h3>Chat history (kept 35 hours)</h3>
  <div class="hist" id="history">Loading…</div>

  <h3>VIP (unlimited messages)</h3>
  <div class="hist" id="vipStatus">…</div>
  <button class="item" id="buyMonthly">VIP · 1 month — 500 ⭐</button>
  <button class="item" id="buyQuarterly">VIP · 3 months — 1100 ⭐</button>
</aside>

<footer>
  <div class="model-row">
    <select id="provider">
      <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
      <option value="openai/gpt-4o-mini">GPT-4o mini</option>
      <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku</option>
      <option value="deepseek/deepseek-chat">DeepSeek V3</option>
      <option value="qwen/qwen-2.5-72b-instruct">Qwen 2.5 72B</option>
    </select>
  </div>
  <div class="input-row">
    <div class="attach-menu" id="attachMenu">
      <button data-att="file">📄 File (text)</button>
    </div>
    <button class="round" id="plusBtn" aria-label="Attach">+</button>
    <textarea id="input" rows="1" placeholder="Message"></textarea>
    <button class="round primary" id="sendBtn" aria-label="Send">➤</button>
  </div>
  <input type="file" id="fileIn" accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.log" hidden>
  <input type="file" id="photoIn" accept="image/*" hidden>
</footer>

<script>
  const API = "https://vpyoanncohbopjxyilxh.supabase.co/functions/v1/api";

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg ? tg.initData : "";

  const $ = (id) => document.getElementById(id);
  const state = { tokens: null, vip: false, lang: "en", theme: "black", provider: "openrouter" };
  let busy = false;
  let pending = null;
  let recorder = null;
  let chunks = [];

  async function api(action, extra = {}) {
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, initData, ...extra }),
      });
      return await r.json();
    } catch (e) {
      return { error: "network" };
    }
  }

  function addMsg(role, text) {
    const e = $("emptyMsg");
    if (e) e.remove();
    const d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    $("messages").appendChild(d);
    $("messages").scrollTop = 1e9;
    return d;
  }

  function errorText(r) {
    switch (r.error) {
      case "unauthorized": return "Open this app from Telegram.";
      case "no_tokens": return "Your free tokens for today are used up. VIP is coming soon.";
      case "join": return "To keep chatting, join the channel first: " + r.link;
      case "need_gemini": return "Photos and voice need the Gemini model. Switch the model to Gemini.";
      case "too_big": return "This file is too large.";
      case "model": return "The model failed to answer. Please try again.";
      case "network": return "Network error. Please try again.";
      case "invoice": return "Could not create the payment link. Please try again.";
      case "bad_plan": return "Invalid plan.";
      default: return "Something went wrong (" + (r.error || "unknown") + ").";
    }
  }

  function setTokens() {
    const t = state.vip ? "VIP ∞" : `${state.tokens} tokens`;
    $("tokens").textContent = t;
    $("drawerTokens").textContent = t;
    renderVip();
  }

  function renderVip() {
    if (state.vip && state.vip_until) {
      $("vipStatus").textContent = "Active until " + new Date(state.vip_until).toISOString().slice(0, 10);
    } else {
      $("vipStatus").textContent = "Not active. Free plan: 10 tokens per day.";
    }
  }

  function applyTheme(t) {
    state.theme = t;
    document.body.classList.toggle("white", t === "white");
    document.querySelectorAll("[data-theme]").forEach((b) =>
      b.classList.toggle("on", b.dataset.theme === t));
  }

  function setPendingUI() {
    if (!pending) $("input").placeholder = "Message";
    else if (pending.kind === "file") $("input").placeholder = "Attached: " + pending.name + " (type to add a note)";
    else $("input").placeholder = "Attached: " + pending.kind + " (type to add a note)";
  }

  async function loadMe() {
    const me = await api("me");
    if (me.error) {
      addMsg("error", errorText(me));
      return;
    }
    Object.assign(state, me);
    $("provider").value = me.model;
    $("lang").value = me.lang;
    applyTheme(me.theme);
    setTokens();
  }

  async function loadHistory(render = false) {
    const r = await api("history");
    const box = $("history");
    if (r.error) { box.textContent = "Could not load history."; return; }

    box.innerHTML = "";
    if (!r.messages.length) box.textContent = "No messages in the last 35 hours.";
    r.messages.forEach((m) => {
      const d = document.createElement("div");
      d.className = "hist-item";
      const b = document.createElement("b");
      b.textContent = m.role === "user" ? "You: " : "AI: ";
      const s = document.createElement("span");
      s.textContent = m.content.slice(0, 150);
      d.append(b, s);
      box.append(d);
    });

    if (render) {
      $("messages").innerHTML = "";
      if (!r.messages.length) {
        $("messages").innerHTML = '<div class="empty" id="emptyMsg">Ask me anything</div>';
      } else {
        r.messages.forEach((m) => addMsg(m.role, m.content));
      }
    }
  }

  async function saveSettings(patch) {
    const me = await api("settings", patch);
    if (me.error) { addMsg("error", errorText(me)); return; }
    Object.assign(state, me);
    setTokens();
    applyTheme(me.theme);
  }

  async function send() {
    if (busy) return;
    const typed = $("input").value.trim();
    if (!typed && !pending) return;

    let text = typed;
    let attachment;
    let shown = typed;

    if (pending && pending.kind === "file") {
      text = `File: ${pending.name}\n\`\`\`\n${pending.text}\n\`\`\`\n${typed}`.trim();
      shown = `📄 ${pending.name}${typed ? "\n" + typed : ""}`;
    } else if (pending) {
      attachment = {
        kind: pending.kind === "photo" ? "image" : "audio",
        mime: pending.mime,
        data: pending.data,
      };
      shown = (pending.kind === "photo" ? "🖼 Photo" : "🎤 Voice") + (typed ? "\n" + typed : "");
    }

    addMsg("user", shown);
    $("input").value = "";
    pending = null;
    setPendingUI();

    busy = true;
    const typing = addMsg("assistant", "…");
    const res = await api("send", { text, attachment });
    typing.remove();
    busy = false;

    if (res.error) { addMsg("error", errorText(res)); return; }
    addMsg("assistant", res.reply);
    state.tokens = res.tokens;
    setTokens();
  }

  function toBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(",")[1]);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  async function toggleRecord() {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const type = ["audio/ogg", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t));
      recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      chunks = [];
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType });
        pending = { kind: "voice", mime: blob.type.split(";")[0], data: await toBase64(blob) };
        $("plusBtn").classList.remove("rec");
        setPendingUI();
      };
      recorder.start();
      $("plusBtn").classList.add("rec");
      $("input").placeholder = "Recording… tap Voice again to stop";
    } catch (e) {
      addMsg("error", "Microphone access was denied.");
    }
  }

  async function refreshMe() {
    const me = await api("me");
    if (!me.error) { Object.assign(state, me); setTokens(); }
  }

  async function buyVip(plan) {
    const r = await api("vip_invoice", { plan });
    if (r.error || !r.link) { addMsg("error", errorText(r)); return; }
    if (!tg || !tg.openInvoice) { addMsg("error", "Open this app from Telegram to pay."); return; }
    tg.openInvoice(r.link, (status) => {
      if (status === "paid") {
        addMsg("assistant", "Payment received. Activating VIP…");
        setTimeout(refreshMe, 2000);
        setTimeout(refreshMe, 6000);
      }
    });
  }

  $("buyMonthly").onclick = () => buyVip("monthly");
  $("buyQuarterly").onclick = () => buyVip("quarterly");

  $("sendBtn").onclick = send;
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  $("plusBtn").onclick = () => $("attachMenu").classList.toggle("open");
  document.querySelectorAll("[data-att]").forEach((b) => {
    b.onclick = () => {
      $("attachMenu").classList.remove("open");
      const kind = b.dataset.att;
      if (kind === "file") $("fileIn").click();
      if (kind === "photo") $("photoIn").click();
      if (kind === "voice") toggleRecord();
    };
  });

  $("fileIn").onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 200_000) { addMsg("error", "Text files must be under 200 KB."); return; }
    const text = (await f.text()).slice(0, 20000);
    pending = { kind: "file", name: f.name, text };
    setPendingUI();
  };

  $("photoIn").onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 5_000_000) { addMsg("error", "Images must be under 5 MB."); return; }
    pending = { kind: "photo", mime: f.type || "image/jpeg", data: await toBase64(f) };
    setPendingUI();
  };

  const drawer = $("drawer");
  const bg = $("drawerBg");
  const openDrawer = () => { drawer.classList.add("open"); bg.classList.add("open"); loadHistory(); };
  const closeDrawer = () => { drawer.classList.remove("open"); bg.classList.remove("open"); };
  $("menuBtn").onclick = openDrawer;
  bg.onclick = closeDrawer;

  $("newChat").onclick = async () => {
    await api("clear");
    $("messages").innerHTML = '<div class="empty" id="emptyMsg">New chat started</div>';
    loadHistory();
    closeDrawer();
  };

  $("provider").onchange = (e) => saveSettings({ model: e.target.value });
  $("lang").onchange = (e) => saveSettings({ lang: e.target.value });
  document.querySelectorAll("[data-theme]").forEach((b) => {
    b.onclick = () => saveSettings({ theme: b.dataset.theme });
  });

  (async function init() {
    await loadMe();
    await loadHistory(true);
  })();
</script>
</body>
</html>
