<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BadGPT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#000; --fg:#f2f2f2; --panel:#111; --bubble:#1c1c1c;
    --line:#2a2a2a; --accent:#7c5cff; --muted:#888;
    color-scheme: dark;
  }
  body.white {
    --bg:#fff; --fg:#111; --panel:#f5f5f5; --bubble:#ececec;
    --line:#dcdcdc; --muted:#666;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, Tahoma, sans-serif;
    display: flex; flex-direction: column;
    transition: background .25s, color .25s;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .title { font-weight: 700; flex: 1; }
  .title small { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 4px; }
  .badge {
    font-size: 13px; padding: 4px 10px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--line); white-space: nowrap;
  }
  .icon-btn {
    background: none; border: none; color: var(--fg);
    font-size: 22px; padding: 4px 8px; cursor: pointer;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.7; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; color: #ff6b6b; font-size: 14px; background: none; text-align: center; }
  .empty { margin: auto; color: var(--muted); text-align: center; }

  footer {
    border-top: 1px solid var(--line); background: var(--bg);
    padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .model-row { display: flex; justify-content: center; margin-bottom: 8px; }
  select {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 12px; font-size: 14px; font-family: inherit;
  }
  .input-row { display: flex; align-items: flex-end; gap: 6px; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 10px 14px; font: inherit; max-height: 120px;
  }
  .round {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); font-size: 20px; cursor: pointer;
  }
  .round.primary { background: var(--accent); color: #fff; border: none; }

  .drawer-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; z-index: 10;
  }
  .drawer-bg.open { display: block; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: 84%; max-width: 340px;
    background: var(--panel); z-index: 11; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 14px 16px;
    transform: translateX(-100%); transition: transform .25s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h3 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .drawer .item {
    width: 100%; padding: 12px; border-radius: 10px; font-size: 15px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    text-align: left; cursor: pointer; font-family: inherit;
  }
  .drawer .item.primary { background: var(--accent); color: #fff; border: none; font-weight: 600; }
  .drawer select { width: 100%; border-radius: 10px; padding: 10px; }
  .toggle { display: flex; gap: 8px; }
  .toggle button {
    flex: 1; padding: 10px; border-radius: 10px; cursor: pointer;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); font-family: inherit;
  }
  .toggle button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .hist { font-size: 13px; color: var(--muted); }

  .chat-row { display: flex; gap: 6px; align-items: stretch; margin-bottom: 6px; }
  .chat-row .open {
    flex: 1; padding: 10px 12px; border-radius: 10px; font-size: 14px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    text-align: left; cursor: pointer; font-family: inherit;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .chat-row.active .open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .chat-row .del {
    width: 40px; border-radius: 10px; font-size: 15px; cursor: pointer;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
  <div class="title">BadGPT <small>v5</small></div>
  <button class="icon-btn" id="newBtn" aria-label="New chat">✎</button>
  <div class="badge" id="tokens">…</div>
</header>

<div id="messages"><div class="empty" id="emptyMsg">Ask me anything</div></div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer">
  <div class="badge" id="drawerTokens" style="align-self:flex-start">…</div>

  <button class="item primary" id="newChat">＋ New chat</button>

  <h3>Your chats (deleted after 35 hours)</h3>
  <div id="chatList" class="hist">Loading…</div>

  <h3>Reply language</h3>
  <select id="lang">
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
    <option value="ar">العربية</option>
    <option value="tr">Türkçe</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="hi">हिन्दी</option>
    <option value="ja">日本語</option>
  </select>

  <h3>Background</h3>
  <div class="toggle">
    <button data-theme="black">Black</button>
    <button data-theme="white">White</button>
  </div>

  <h3>VIP (unlimited messages)</h3>
  <div class="hist" id="vipStatus">…</div>
  <button class="item" id="buyMonthly">VIP · 1 month — 500 ⭐</button>
  <button class="item" id="buyQuarterly">VIP · 3 months — 1100 ⭐</button>
</aside>

<footer>
  <div class="model-row">
    <select id="model">
      <option value="venice">Venice · Free</option>
      <option value="mistral">Mistral · Free</option>
      <option value="openai" data-locked="1">🔒 GPT · VIP</option>
      <option value="deepseek" data-locked="1">🔒 DeepSeek · VIP</option>
      <option value="llama" data-locked="1">🔒 Llama · VIP</option>
      <option value="qwen" data-locked="1">🔒 Qwen · VIP</option>
    </select>
  </div>
  <div class="input-row">
    <button class="round" id="plusBtn" aria-label="Attach text file">+</button>
    <textarea id="input" rows="1" placeholder="Message"></textarea>
    <button class="round primary" id="sendBtn" aria-label="Send">➤</button>
  </div>
  <input type="file" id="fileIn" accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.log" hidden>
</footer>

<script>
  const API = "https://vpyoanncohbopjxyilxh.supabase.co/functions/v1/api";

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg ? tg.initData : "";

  const $ = (id) => document.getElementById(id);
  const state = { tokens: null, vip: false, vip_until: null, lang: "en", theme: "black", model: "mistral" };
  let convId = null;     // current chat (null = a new chat that has not been started yet)
  let chats = [];
  let busy = false;
  let pending = null;    // attached text file { name, text }

  async function api(action, extra = {}) {
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, initData, ...extra }),
      });
      return await r.json();
    } catch (e) {
      return { error: "network" };
    }
  }

  function clearMessages(text) {
    const box = $("messages");
    box.innerHTML = "";
    const d = document.createElement("div");
    d.className = "empty";
    d.id = "emptyMsg";
    d.textContent = text;
    box.appendChild(d);
  }

  function addMsg(role, text) {
    const e = $("emptyMsg");
    if (e) e.remove();
    const d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    $("messages").appendChild(d);
    $("messages").scrollTop = 1e9;
    return d;
  }

  function errorText(r) {
    switch (r.error) {
      case "unauthorized": return "Open this app from Telegram.";
      case "no_tokens": return "Your free tokens for today are used up.";
      case "join": return "To keep chatting, join the channel first: " + r.link;
      case "model": return "The model failed to answer. Please try again or pick another model.";
      case "network": return "Network error. Please try again.";
      case "locked": return "This model is locked 🔒 VIP only. Venice and Mistral are free.";
      case "not_found": return "This chat no longer exists.";
      case "invoice": return "Could not create the payment link. Please try again.";
      case "bad_plan": return "Invalid plan.";
      default: return "Something went wrong (" + (r.error || "unknown") + ").";
    }
  }

  function renderVip() {
    if (state.vip && state.vip_until) {
      $("vipStatus").textContent = "Active until " + new Date(state.vip_until).toISOString().slice(0, 10);
    } else {
      $("vipStatus").textContent = "Not active. Free plan: 10 tokens per day.";
    }
  }

  function setTokens() {
    const t = state.vip ? "VIP ∞" : `${state.tokens} tokens`;
    $("tokens").textContent = t;
    $("drawerTokens").textContent = t;
    renderVip();
  }

  function applyTheme(t) {
    state.theme = t;
    document.body.classList.toggle("white", t === "white");
    document.querySelectorAll("[data-theme]").forEach((b) =>
      b.classList.toggle("on", b.dataset.theme === t));
  }

  function setPendingUI() {
    $("input").placeholder = pending ? "Attached: " + pending.name + " (type a note)" : "Message";
  }

  function renderChats() {
    const box = $("chatList");
    box.innerHTML = "";
    if (!chats.length) { box.textContent = "No chats yet. Send a message to start one."; return; }
    chats.forEach((c) => {
      const row = document.createElement("div");
      row.className = "chat-row" + (c.id === convId ? " active" : "");

      const open = document.createElement("button");
      open.className = "open";
      open.textContent = c.title || "New chat";
      open.onclick = () => openChat(c.id);

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.setAttribute("aria-label", "Delete chat");
      del.onclick = () => removeChat(c.id);

      row.append(open, del);
      box.append(row);
    });
  }

  async function loadChats() {
    const r = await api("chats");
    if (r.error) { $("chatList").textContent = "Could not load chats."; return false; }
    chats = r.chats;
    renderChats();
    return true;
  }

  async function openChat(id) {
    const r = await api("chat", { conv_id: id });
    if (r.error) { addMsg("error", errorText(r)); await loadChats(); return; }
    convId = r.conv_id;
    clearMessages("");
    $("emptyMsg").remove();
    r.messages.forEach((m) => addMsg(m.role, m.content));
    renderChats();
    closeDrawer();
  }

  function newChat() {
    convId = null;
    pending = null;
    setPendingUI();
    clearMessages("New chat. Ask me anything");
    renderChats();
    closeDrawer();
  }

  async function removeChat(id) {
    await api("delete_chat", { conv_id: id });
    if (id === convId) newChat();
    await loadChats();
  }

  async function saveSettings(patch) {
    const me = await api("settings", patch);
    if (me.error) { addMsg("error", errorText(me)); $("model").value = state.model; return; }
    Object.assign(state, me);
    setTokens();
    applyTheme(me.theme);
  }

  async function send() {
    if (busy) return;
    const typed = $("input").value.trim();
    if (!typed && !pending) return;

    let text = typed;
    let shown = typed;
    if (pending) {
      text = `File: ${pending.name}\n\`\`\`\n${pending.text}\n\`\`\`\n${typed}`.trim();
      shown = `📄 ${pending.name}${typed ? "\n" + typed : ""}`;
    }

    addMsg("user", shown);
    $("input").value = "";
    pending = null;
    setPendingUI();

    busy = true;
    const typing = addMsg("assistant", "…");
    const res = await api("send", { text, conv_id: convId });
    typing.remove();
    busy = false;

    if (res.conv_id) convId = res.conv_id;
    if (res.error) { addMsg("error", errorText(res)); loadChats(); return; }

    addMsg("assistant", res.reply);
    state.tokens = res.tokens;
    setTokens();
    loadChats();
  }

  async function refreshMe() {
    const me = await api("me");
    if (!me.error) { Object.assign(state, me); setTokens(); }
  }

  async function buyVip(plan) {
    const r = await api("vip_invoice", { plan });
    if (r.error || !r.link) { addMsg("error", errorText(r)); return; }
    if (!tg || !tg.openInvoice) { addMsg("error", "Open this app from Telegram to pay."); return; }
    tg.openInvoice(r.link, (status) => {
      if (status === "paid") {
        addMsg("assistant", "Payment received. Activating VIP…");
        setTimeout(refreshMe, 2000);
        setTimeout(refreshMe, 6000);
      }
    });
  }

  const drawer = $("drawer");
  const bg = $("drawerBg");
  function openDrawer() { drawer.classList.add("open"); bg.classList.add("open"); loadChats(); }
  function closeDrawer() { drawer.classList.remove("open"); bg.classList.remove("open"); }

  $("menuBtn").onclick = openDrawer;
  bg.onclick = closeDrawer;
  $("newBtn").onclick = newChat;
  $("newChat").onclick = newChat;
  $("sendBtn").onclick = send;
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  $("plusBtn").onclick = () => $("fileIn").click();
  $("fileIn").onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 200000) { addMsg("error", "Text files must be under 200 KB."); return; }
    pending = { name: f.name, text: (await f.text()).slice(0, 20000) };
    setPendingUI();
  };

  $("model").onchange = (e) => {
    const opt = e.target.selectedOptions[0];
    if (opt && opt.dataset.locked && !state.vip) {
      e.target.value = state.model;
      addMsg("error", errorText({ error: "locked" }));
      return;
    }
    saveSettings({ model: e.target.value });
  };
  $("lang").onchange = (e) => saveSettings({ lang: e.target.value });
  document.querySelectorAll("[data-theme]").forEach((b) => {
    b.onclick = () => saveSettings({ theme: b.dataset.theme });
  });
  $("buyMonthly").onclick = () => buyVip("monthly");
  $("buyQuarterly").onclick = () => buyVip("quarterly");

  (async function init() {
    const me = await api("me");
    if (me.error) { addMsg("error", errorText(me)); return; }
    Object.assign(state, me);
    $("model").value = me.model;
    $("lang").value = me.lang;
    applyTheme(me.theme);
    setTokens();
    if (await loadChats() && chats.length) await openChat(chats[0].id);
  })();
</script>
</body>
</html>
